services:
  - type: web
    name: corverxis-platform
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: corverxis-db
          property: connectionString
      - key: APP_URL
        sync: false          # Set manually in Render dashboard to your full https:// URL
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@corverxis.com
      - key: GOOGLE_CLIENT_ID
        sync: false          # Set in Render dashboard after creating Google OAuth app
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AZURE_AD_CLIENT_ID
        sync: false
      - key: AZURE_AD_CLIENT_SECRET
        sync: false
      - key: AZURE_AD_TENANT_ID
        sync: false

databases:
  - name: corverxis-db
    plan: free
    databaseName: corverxis
    user: corverxis
