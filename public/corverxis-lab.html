<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorverxisLab | AI Engineering &amp; Data Infrastructure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0a1628;--navy2:#0d1f3c;--navy3:#112645;
  --ocean:#00c2e0;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --text:#e2e8f0;--muted:#6b7280;--text2:#9ca3af;--border:rgba(255,255,255,0.08);
}
body{background:var(--navy);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden;}
.shell{display:grid;grid-template-columns:250px 1fr;height:100vh;}
.sidebar{background:var(--navy2);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;}
.main{overflow-y:auto;padding:24px 32px;}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:22px;padding:4px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00c2e0,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#0a1628;flex-shrink:0}
.logo-text{font-size:14px;font-weight:800}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.5px}
.proj-select{width:100%;padding:9px 10px;background:var(--navy3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;margin-bottom:18px;cursor:pointer}
.nav-section-label{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin:14px 0 6px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:12.5px;color:var(--text2);transition:all .15s;border:1px solid transparent}
.nav-item:hover{background:var(--navy3);color:var(--text)}
.nav-item.active{background:rgba(0,194,224,.1);border-color:rgba(0,194,224,.3);color:#00c2e0;font-weight:700}
.nav-icon{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted)}
.pt{font-size:22px;font-weight:800;margin-bottom:4px}
.ps{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi-l{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.kpi-v{font-size:22px;font-weight:800;margin-bottom:2px}
.kpi-s{font-size:10px;color:var(--muted)}
.card{background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.ct{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
tr:last-child td{border-bottom:none}
.badge{font-size:9.5px;padding:2px 8px;border-radius:4px;font-weight:700;display:inline-block}
.badge.ok{background:rgba(34,197,94,.15);color:#22c55e}
.badge.warn{background:rgba(245,158,11,.15);color:#f59e0b}
.badge.err{background:rgba(239,68,68,.15);color:#ef4444}
.badge.info{background:rgba(0,194,224,.15);color:#00c2e0}
.badge.muted{background:rgba(107,114,128,.15);color:#9ca3af}
.btn{padding:8px 16px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.btn-primary{background:#00c2e0;color:#0a1628}
.btn-secondary{background:var(--navy3);color:var(--text2);border:1px solid var(--border)}
.tab-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:7px 14px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2)}
.tab-btn.active{background:rgba(0,194,224,.12);border-color:rgba(0,194,224,.35);color:#00c2e0}
.progress-bar{height:5px;background:var(--navy3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00c2e0,#22c55e);transition:width .4s ease}
.phase-track{display:flex;gap:4px;margin-bottom:18px}
.phase-step{flex:1;text-align:center;padding:10px 6px;border-radius:8px;background:var(--navy3);border:1px solid var(--border);font-size:10px;color:var(--muted);cursor:default}
.phase-step.done{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#22c55e}
.phase-step.current{background:rgba(0,194,224,.12);border-color:rgba(0,194,224,.4);color:#00c2e0;font-weight:700}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.module-card{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.module-card:hover{border-color:rgba(0,194,224,.3);transform:translateY(-1px)}
.module-icon{width:34px;height:34px;border-radius:8px;background:rgba(0,194,224,.12);color:#00c2e0;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
.module-title{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.module-desc{font-size:10.5px;color:var(--muted);line-height:1.4}
#modal-overlay{position:fixed;inset:0;background:rgba(5,10,20,.72);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#0d1f3c;border:1px solid rgba(0,194,224,.25);border-radius:12px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#9ca3af;margin-bottom:4px}
.field select,.field input,.field textarea{width:100%;padding:8px;background:#112645;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
#toast{position:fixed;bottom:24px;right:24px;z-index:3000;background:#0d1f3c;border-left:4px solid #22c55e;border-radius:8px;padding:12px 18px;color:#e2e8f0;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:all .25s ease}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-mark">CL</div>
      <div><div class="logo-text">CorverxisLab</div><div class="logo-sub">AI ENGINEERING &amp; DATA INFRA</div></div>
    </div>
    <select class="proj-select" id="project-select" onchange="onProjectChange(this.value)"></select>

    <div class="nav-section-label">Build Environment</div>
    <div class="nav-item active" data-tab="overview" onclick="showTab('overview')"><span class="nav-icon">◈</span>Overview</div>
    <div class="nav-item" data-tab="onboarding" onclick="showTab('onboarding')"><span class="nav-icon">⬡</span>Site Onboarding</div>
    <div class="nav-item" data-tab="infra" onclick="showTab('infra')"><span class="nav-icon">⟐</span>Data Infrastructure</div>
    <div class="nav-item" data-tab="datasets" onclick="showTab('datasets')"><span class="nav-icon">⊞</span>Datasets</div>
    <div class="nav-item" data-tab="training" onclick="showTab('training')"><span class="nav-icon">✎</span>Training Pipelines</div>
    <div class="nav-item" data-tab="models" onclick="showTab('models')"><span class="nav-icon">⊛</span>Models</div>

    <div class="nav-section-label">All Projects</div>
    <div class="nav-item" data-tab="allprojects" onclick="showTab('allprojects')"><span class="nav-icon">⊡</span>Every Pilot's Lab</div>

    <div class="sidebar-footer">
      <div id="lab-live-badge" style="color:#f59e0b">CONNECTING…</div>
      <div style="margin-top:4px">CorverxisLab v1.0 · Corverxis Technologies</div>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CorverxisLab — the technical build environment behind every
//  pilot study: site onboarding & data integration, data
//  infrastructure, dataset management, training pipelines, and
//  ML/LLM model training. Reads/writes /api/v1/lab/* on the
//  CorverxisONE backend.
// ══════════════════════════════════════════════════════════════

var PILLAR_LABELS = {
  PREDICTIVE_MAINTENANCE: 'Predictive Maintenance', QUALITY_CONTROL: 'Computer Vision QC',
  SUPPLY_CHAIN: 'Supply Chain AI', PROCESS_OPTIMIZATION: 'Process Optimization', GENERAL: 'General',
};
var PILLAR_COLORS = {
  PREDICTIVE_MAINTENANCE: '#8b5cf6', QUALITY_CONTROL: '#00c2e0',
  SUPPLY_CHAIN: '#f59e0b', PROCESS_OPTIMIZATION: '#22c55e', GENERAL: '#6b7280',
};
var PHASE_ORDER = ['SITE_ONBOARDING','DATA_INFRASTRUCTURE','COLLECTION_PROCESSING','TRAINING_PIPELINE','MODEL_TRAINING','VALIDATION'];
var PHASE_LABELS = {
  SITE_ONBOARDING: 'Site Onboarding', DATA_INFRASTRUCTURE: 'Data Infra', COLLECTION_PROCESSING: 'Collect & Process',
  TRAINING_PIPELINE: 'Training Pipeline', MODEL_TRAINING: 'Model Training', VALIDATION: 'Validation',
};
var SOURCE_TYPE_LABELS = { ERP:'ERP', MES:'MES', IIOT_SENSOR:'IIoT Sensor', SCADA_HISTORIAN:'SCADA/Historian', VISION_CAMERA:'Vision Camera', FILE_UPLOAD:'File Upload', API_FEED:'API Feed' };
var STAGE_LABELS = { INGESTION:'Ingestion', CLEANING:'Cleaning', TRANSFORMATION:'Transformation', FEATURE_ENGINEERING:'Feature Engineering', LABELING:'Labeling' };
var MODELTYPE_LABELS = { CLASSICAL_ML:'Classical ML', TIME_SERIES:'Time-Series', VISION:'Vision', LLM:'LLM' };

var LAB_LIVE = false;
var PROJECTS = [];
var CURRENT_PROJECT_ID = null;
var CURRENT_PROJECT = null;
var ACTIVE_TAB = 'overview';

// ── Boot ─────────────────────────────────────────────────────
async function boot() {
  await loadProjects();
  var urlParams = new URLSearchParams(location.search);
  var wantPillar = urlParams.get('pillar');
  var matched = wantPillar ? PROJECTS.find(function(p){ return p.pillar === wantPillar; }) : null;
  if (matched) {
    CURRENT_PROJECT_ID = matched.id;
  } else if (PROJECTS.length) {
    CURRENT_PROJECT_ID = PROJECTS[0].id;
  }
  renderProjectSelect();
  if (CURRENT_PROJECT_ID) await loadCurrentProject();
  showTab('overview');
}

async function loadProjects() {
  try {
    var r = await fetch('/api/v1/lab/projects', { credentials:'same-origin' });
    if (!r.ok) throw new Error('unavailable');
    PROJECTS = (await r.json()).data || [];
    LAB_LIVE = true;
    _setBadge('LIVE', '#22c55e');
  } catch(e) {
    PROJECTS = [];
    LAB_LIVE = false;
    _setBadge('API UNAVAILABLE', '#ef4444');
  }
}
async function loadCurrentProject() {
  if (!CURRENT_PROJECT_ID) { CURRENT_PROJECT = null; return; }
  try {
    var r = await fetch('/api/v1/lab/projects/' + CURRENT_PROJECT_ID, { credentials:'same-origin' });
    if (!r.ok) throw new Error('unavailable');
    CURRENT_PROJECT = (await r.json()).data;
  } catch(e) { CURRENT_PROJECT = null; }
}
function _setBadge(text, color) {
  var el = document.getElementById('lab-live-badge');
  if (el) { el.textContent = text; el.style.color = color; }
}

function renderProjectSelect() {
  var sel = document.getElementById('project-select');
  if (!PROJECTS.length) {
    sel.innerHTML = '<option value="">No lab projects yet</option>';
    return;
  }
  sel.innerHTML = PROJECTS.map(function(p){
    return '<option value="'+p.id+'"'+(p.id===CURRENT_PROJECT_ID?' selected':'')+'>'+PILLAR_LABELS[p.pillar]+'</option>';
  }).join('');
}
window.onProjectChange = async function(id) {
  CURRENT_PROJECT_ID = id;
  await loadCurrentProject();
  showTab(ACTIVE_TAB);
};

// ── Tab dispatch ─────────────────────────────────────────────
window.showTab = function(tab) {
  ACTIVE_TAB = tab;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.tab === tab); });
  var renderers = {
    overview: renderOverview, onboarding: renderOnboarding, infra: renderInfra,
    datasets: renderDatasets, training: renderTraining, models: renderModels,
    allprojects: renderAllProjects,
  };
  (renderers[tab] || renderOverview)();
};

function _mainEl() { return document.getElementById('main-content'); }

function _noProjectState() {
  return '<div class="pt">CorverxisLab</div><div class="ps">The build environment behind every pilot study</div>' +
    '<div class="card" style="text-align:center;padding:36px">' +
      '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">No lab projects yet.</div>' +
      '<button class="btn btn-primary" id="seed-defaults-btn" onclick="seedDefaults()">Load Default Pilot Lab Projects (4)</button>' +
    '</div>';
}
window.seedDefaults = async function() {
  var btn = document.getElementById('seed-defaults-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    await _post('/api/v1/lab/projects/seed-defaults', {});
    await loadProjects();
    renderProjectSelect();
    if (PROJECTS.length) { CURRENT_PROJECT_ID = PROJECTS[0].id; await loadCurrentProject(); }
    showTab('overview');
  } catch(e) {
    alert('Could not load default projects: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Load Default Pilot Lab Projects (4)'; }
  }
};

// ── Overview ─────────────────────────────────────────────────
function renderOverview() {
  var el = _mainEl();
  if (!PROJECTS.length) { el.innerHTML = _noProjectState(); return; }
  var p = CURRENT_PROJECT;
  if (!p) { el.innerHTML = '<div class="pt">Loading…</div>'; return; }
  var col = PILLAR_COLORS[p.pillar];

  var sourcesConnected = p.dataSources.filter(function(d){return d.status==='CONNECTED';}).length;
  var pipelinesActive = p.pipelines.filter(function(x){return x.status==='ACTIVE';}).length;
  var jobsRunning = p.trainingJobs.filter(function(j){return j.status==='RUNNING';}).length;
  var jobsDone = p.trainingJobs.filter(function(j){return j.status==='COMPLETED';}).length;
  var modelsProd = p.models.filter(function(m){return m.status==='PRODUCTION';}).length;

  el.innerHTML =
    '<div class="pt">'+p.title+'</div>' +
    '<div class="ps">'+(p.clientSiteName||'—')+' · '+(p.description||'')+'</div>' +

    '<div class="phase-track">' +
      PHASE_ORDER.map(function(ph, i){
        var currentIdx = PHASE_ORDER.indexOf(p.phase);
        var cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
        return '<div class="phase-step '+cls+'" onclick="setPhase(\''+ph+'\')" style="cursor:pointer">'+(i<currentIdx?'✓ ':'')+PHASE_LABELS[ph]+'</div>';
      }).join('') +
    '</div>' +

    '<div class="kg">' +
      _kpi('Data Sources Connected', sourcesConnected+' / '+p.dataSources.length, '#00c2e0') +
      '<div class="kpi"><div class="kpi-l">Pipelines Active</div><div class="kpi-v" style="color:#22c55e">'+pipelinesActive+' / '+p.pipelines.length+'</div><div class="kpi-s">Ingestion → labeling</div></div>' +
      '<div class="kpi"><div class="kpi-l">Datasets Registered</div><div class="kpi-v" style="color:#8b5cf6">'+p.datasets.length+'</div><div class="kpi-s">'+p.datasets.reduce(function(a,d){return a+d.rowCount;},0).toLocaleString()+' total rows</div></div>' +
      '<div class="kpi"><div class="kpi-l">Training Jobs</div><div class="kpi-v" style="color:#f59e0b">'+jobsRunning+' running</div><div class="kpi-s">'+jobsDone+' completed</div></div>' +
      '<div class="kpi"><div class="kpi-l">Production Models</div><div class="kpi-v" style="color:'+col+'">'+modelsProd+'</div><div class="kpi-s">'+p.models.length+' total registered</div></div>' +
    '</div>' +

    '<div class="ct" style="margin-bottom:10px">Build Modules</div>' +
    '<div class="module-grid">' +
      _moduleCard('⬡','Site Onboarding','Connect ERP/MES/IIoT sources for the client plant','onboarding') +
      _moduleCard('⟐','Data Infrastructure','Ingestion, cleaning, and feature pipelines','infra') +
      _moduleCard('⊞','Datasets','Versioned training/val/test splits','datasets') +
      _moduleCard('✎','Training Pipelines','Launch and monitor ML/LLM training jobs','training') +
      _moduleCard('⊛','Models','Registry, versions, and pilot deployment','models') +
    '</div>' +

    (p.courseSlug ? '<div class="card" style="margin-top:14px"><div class="ct">Related</div>' +
      '<button class="btn btn-secondary" onclick="window.open(\'/academy?course='+p.courseSlug+'\',\'_blank\')">Open matching CorverxisAcademy course →</button></div>' : '');
}

function _kpi(label, val, color) {
  return '<div class="kpi"><div class="kpi-l">'+label+'</div><div class="kpi-v" style="color:'+color+'">'+val+'</div></div>';
}
function _moduleCard(icon, title, desc, tab) {
  return '<div class="module-card" onclick="showTab(\''+tab+'\')"><div class="module-icon">'+icon+'</div><div class="module-title">'+title+'</div><div class="module-desc">'+desc+'</div></div>';
}

window.setPhase = async function(phase) {
  if (!CURRENT_PROJECT) return;
  try {
    await _patch('/api/v1/lab/projects/'+CURRENT_PROJECT.id, { phase: phase });
    await loadCurrentProject();
    showTab('overview');
    _toast('✓ Phase updated to '+PHASE_LABELS[phase]);
  } catch(e) { alert('Could not update phase: '+e.message); }
};

// ── Site Onboarding (data sources) ──────────────────────────
function renderOnboarding() {
  var el = _mainEl();
  if (!CURRENT_PROJECT) { el.innerHTML = _noProjectState(); return; }
  var p = CURRENT_PROJECT;
  el.innerHTML =
    '<div class="pt">Site Onboarding &amp; Data Integration</div>' +
    '<div class="ps">Connect and clean data sources at '+(p.clientSiteName||'the client site')+' before anything else can start.</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">' +
      '<button class="btn btn-primary" onclick="openAddSource()">+ Add Data Source</button>' +
    '</div>' +
    '<div class="card" style="padding:0;overflow:hidden">' +
      '<table><thead><tr><th>Source</th><th>Type</th><th>Status</th><th>Records Ingested</th><th>Last Sync</th><th></th></tr></thead><tbody>' +
      (p.dataSources.length ? p.dataSources.map(function(d){
        var statusCls = d.status==='CONNECTED'?'ok':d.status==='CONNECTING'?'warn':d.status==='ERROR'?'err':'muted';
        return '<tr><td style="color:var(--text)">'+d.name+'</td><td>'+SOURCE_TYPE_LABELS[d.type]+'</td>' +
          '<td><span class="badge '+statusCls+'">'+d.status.replace('_',' ')+'</span></td>' +
          '<td>'+d.recordsIngested.toLocaleString()+'</td>' +
          '<td>'+(d.lastSyncAt?new Date(d.lastSyncAt).toLocaleDateString():'—')+'</td>' +
          '<td>'+(d.status!=='CONNECTED'?'<button class="btn btn-secondary" style="padding:4px 10px;font-size:10px" onclick="markConnected(\''+d.id+'\')">Mark Connected</button>':'') +'</td></tr>';
      }).join('') : '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted)">No data sources yet. Click "+ Add Data Source" to start onboarding this site.</td></tr>') +
      '</tbody></table>' +
    '</div>';
}
window.markConnected = async function(id) {
  try {
    await _patch('/api/v1/lab/data-sources/'+id, { status:'CONNECTED', recordsIngested: Math.floor(Math.random()*500000)+10000 });
    await loadCurrentProject();
    renderOnboarding();
    _toast('✓ Data source connected');
  } catch(e) { alert('Could not update source: '+e.message); }
};
window.openAddSource = function() {
  openModal('Add Data Source',
    _field('Name','name','text') +
    _field('Type','type','select',['ERP','MES','IIOT_SENSOR','SCADA_HISTORIAN','VISION_CAMERA','FILE_UPLOAD','API_FEED'], SOURCE_TYPE_LABELS) +
    _field('Notes','notes','textarea', null, false),
    async function(payload){
      await _post('/api/v1/lab/projects/'+CURRENT_PROJECT.id+'/data-sources', payload);
      await loadCurrentProject();
      renderOnboarding();
    }
  );
};

// ── Data Infrastructure (pipelines) ─────────────────────────
function renderInfra() {
  var el = _mainEl();
  if (!CURRENT_PROJECT) { el.innerHTML = _noProjectState(); return; }
  var p = CURRENT_PROJECT;
  el.innerHTML =
    '<div class="pt">Data Infrastructure &amp; Pipelines</div>' +
    '<div class="ps">Ingestion, cleaning, transformation, and feature-engineering pipelines feeding the training datasets.</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">' +
      '<button class="btn btn-primary" onclick="openAddPipeline()">+ New Pipeline</button>' +
    '</div>' +
    '<div class="card" style="padding:0;overflow:hidden">' +
      '<table><thead><tr><th>Pipeline</th><th>Stage</th><th>Status</th><th>Records Processed</th><th>Last Run</th><th></th></tr></thead><tbody>' +
      (p.pipelines.length ? p.pipelines.map(function(pl){
        var statusCls = pl.status==='ACTIVE'?'ok':pl.status==='DRAFT'?'muted':pl.status==='PAUSED'?'warn':'err';
        return '<tr><td style="color:var(--text)">'+pl.name+'</td><td>'+STAGE_LABELS[pl.stage]+'</td>' +
          '<td><span class="badge '+statusCls+'">'+pl.status+'</span></td>' +
          '<td>'+pl.recordsProcessed.toLocaleString()+'</td>' +
          '<td>'+(pl.lastRunAt?new Date(pl.lastRunAt).toLocaleDateString():'—')+'</td>' +
          '<td>'+(pl.status!=='ACTIVE'?'<button class="btn btn-secondary" style="padding:4px 10px;font-size:10px" onclick="runPipeline(\''+pl.id+'\')">Run</button>':'') +'</td></tr>';
      }).join('') : '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted)">No pipelines yet. Add one to start processing onboarded data.</td></tr>') +
      '</tbody></table>' +
    '</div>';
}
window.runPipeline = async function(id) {

    renderInfra();

  } catch(e) { alert('Could not run pipeline: '+e.message); }
};
window.openAddPipeline = function() {

  openModal('Register Dataset',
    _field('Name','name','text') +
    _field('Version','version','text', null, false, 'v1') +
    _field('Row count','rowCount','number', null, false) +
    _field('Size (MB)','sizeMb','number', null, false),
    async function(payload){

      await loadCurrentProject();

// ── Training Pipelines (jobs) ────────────────────────────────
function renderTraining() {
  var el = _mainEl();
  if (!CURRENT_PROJECT) { el.innerHTML = _noProjectState(); return; }
  var p = CURRENT_PROJECT;
  el.innerHTML =
    '<div class="pt">Training Pipelines</div>' +
    '<div class="ps">Launch and monitor ML and LLM training jobs — classical models, time-series, vision, and LLM fine-tuning.</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">' +
      '<button class="btn btn-primary" onclick="openLaunchJob()">+ Launch Training Job</button>' +
    '</div>' +
    (p.trainingJobs.length ? p.trainingJobs.map(function(j){
      var statusCls = j.status==='COMPLETED'?'ok':j.status==='RUNNING'?'info':j.status==='FAILED'?'err':'muted';
      var metrics = j.metrics ? Object.keys(j.metrics).map(function(k){ return k+': '+j.metrics[k]; }).join(' · ') : '';
      return '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
          '<div><div class="ct" style="margin-bottom:2px">'+(j.baseModel||MODELTYPE_LABELS[j.modelType])+'</div>' +
          '<div style="font-size:10.5px;color:var(--muted)">'+MODELTYPE_LABELS[j.modelType]+(j.method?' · '+j.method:'')+(j.gpuTier?' · '+j.gpuTier:'')+(j.dataset?' · '+j.dataset.name:'')+'</div></div>' +
          '<span class="badge '+statusCls+'">'+j.status+'</span>' +
        '</div>' +
        (j.status==='RUNNING' ? '<div class="progress-bar"><div class="progress-fill" style="width:'+j.progressPct+'%"></div></div><div style="font-size:10px;color:var(--muted);margin-top:4px">'+j.progressPct+'% complete</div>' : '') +
        (metrics ? '<div style="font-size:10.5px;color:var(--text2);margin-top:8px">'+metrics+'</div>' : '') +
        (j.status==='QUEUED' ? '<button class="btn btn-secondary" style="margin-top:10px;padding:5px 12px;font-size:10.5px" onclick="advanceJob(\''+j.id+'\',\'RUNNING\')">Start Job</button>' : '') +
        (j.status==='RUNNING' ? '<button class="btn btn-secondary" style="margin-top:10px;padding:5px 12px;font-size:10.5px" onclick="advanceJob(\''+j.id+'\',\'COMPLETED\')">Mark Complete</button>' : '') +
      '</div>';
    }).join('') : '<div class="card" style="text-align:center;color:var(--muted)">No training jobs yet. Launch one against a registered dataset.</div>');
}
window.advanceJob = async function(id, status) {
  try {
    var payload = { status: status };
    if (status === 'RUNNING') payload.progressPct = 15;
    await _patch('/api/v1/lab/training-jobs/'+id, payload);
    await loadCurrentProject();
    renderTraining();
    _toast('✓ Job status: '+status);
  } catch(e) { alert('Could not update job: '+e.message); }
};
window.openLaunchJob = function() {
  var datasetOpts = CURRENT_PROJECT.datasets.map(function(d){ return { value:d.id, label:d.name+' ('+d.version+')' }; });
  openModal('Launch Training Job',
    _field('Model type','modelType','select',['CLASSICAL_ML','TIME_SERIES','VISION','LLM'], MODELTYPE_LABELS) +
    _field('Base model / architecture','baseModel','text', null, false, 'e.g. ResNet-50, LSTM, Qwen 3.5 9B') +
    _field('Method','method','text', null, false, 'e.g. LoRA, Transfer Learning, Ensemble Fit') +
    _field('GPU tier','gpuTier','select',['CPU Cluster','Flash — Single GPU','Pro — H100 80GB','Ultra — 8× H100'], null, false) +
    (datasetOpts.length ? _field('Dataset','datasetId','select', datasetOpts.map(function(o){return o.value;}), datasetOpts.reduce(function(a,o){a[o.value]=o.label;return a;},{}), false) : ''),
    async function(payload){
      await _post('/api/v1/lab/projects/'+CURRENT_PROJECT.id+'/training-jobs', payload);
      await loadCurrentProject();
      renderTraining();
    }
  );
};

// ── Models ───────────────────────────────────────────────────

    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">' +
      '<button class="btn btn-primary" onclick="openAddModel()">+ Register Model</button>' +

        '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
          '<div><div class="ct" style="margin-bottom:2px">'+m.name+'</div>' +
          '<div style="font-size:10.5px;color:var(--muted)">'+MODELTYPE_LABELS[m.type]+' · '+m.latestVersion+(m.accuracyPct?' · '+m.accuracyPct+'% accuracy':'')+'</div></div>' +
          '<div style="display:flex;gap:6px;align-items:center">' +
            (m.deployedToPilot ? '<span class="badge ok">✓ Deployed to Pilot</span>' : '') +
            '<span class="badge '+statusCls+'">'+m.status+'</span>' +

        '<div style="display:flex;gap:8px;margin-top:10px">' +
          (m.status!=='PRODUCTION' ? '<button class="btn btn-secondary" style="padding:5px 12px;font-size:10.5px" onclick="promoteModel(\''+m.id+'\')">Promote to Production</button>' : '') +

window.promoteModel = async function(id) {

          '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+col+'"></div></div>' +

// ── Shared modal + form helpers ─────────────────────────────
function _field(label, name, type, options, labelMap, required, placeholder) {
  if (required === undefined) required = true;
  var attrs = 'name="'+name+'" '+(required?'required':'');
  var input;
  if (type === 'select') {
    input = '<select '+attrs+'>' + (options||[]).map(function(o){
      var lbl = labelMap ? (labelMap[o]||o) : o;
      return '<option value="'+o+'">'+lbl+'</option>';
    }).join('') + '</select>';
  } else if (type === 'textarea') {
    input = '<textarea '+attrs+' rows="3"></textarea>';
  } else {
    input = '<input type="'+type+'" '+attrs+(placeholder?' placeholder="'+placeholder+'"':'')+'>';
  }
  return '<div class="field"><label>'+label+'</label>'+input+'</div>';
}
function openModal(title, bodyHtml, onSubmit) {
  var existing = document.getElementById('modal-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
        '<div style="font-size:14px;font-weight:700;color:var(--text)">'+title+'</div>' +
        '<button onclick="document.getElementById(\'modal-overlay\').remove()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button>' +
      '</div>' +
      '<form id="modal-form">' + bodyHtml +
        '<div id="modal-error" style="display:none;color:#ef4444;font-size:11px;margin-bottom:10px"></div>' +
        '<button type="submit" class="btn btn-primary" style="width:100%">Save</button>' +
      '</form>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if (e.target===overlay) overlay.remove(); });
  document.getElementById('modal-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = e.target.querySelector('button[type=submit]');
    var errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Saving…';
    var fd = new FormData(e.target);
    var payload = {};
    fd.forEach(function(v,k){ if (v!=='') payload[k]=v; });
    try { await onSubmit(payload); overlay.remove(); _toast('✓ Saved'); }
    catch(err) { errEl.textContent = err.message||'Something went wrong.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Save'; }
  });
}
function _toast(msg) {
  var existing = document.getElementById('toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.id = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateY(0)'; });
  setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(function(){ t.remove(); }, 300); }, 2600);
}
async function _post(url, body) {
  var r = await fetch(url, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  var json = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(json.error || ('Request failed ('+r.status+')'));
  return json;
}
async function _patch(url, body) {
  var r = await fetch(url, { method:'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  var json = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(json.error || ('Request failed ('+r.status+')'));
  return json;
}

boot();
setInterval(async function(){
  if (document.getElementById('modal-overlay')) return; // don't yank focus mid-form
  await loadProjects();
  renderProjectSelect();
  await loadCurrentProject();
  showTab(ACTIVE_TAB);
}, 30000);
</script>
